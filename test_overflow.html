<!DOCTYPE html>
<html><body>
<script>
fetch("https://thuantuongtieudinh.io.vn/link-khach-moi").then(r=>r.text()).then(html=>{
  const iframe = document.createElement("iframe");
  iframe.style.cssText = "width:390px;height:844px;border:2px solid red;";
  document.body.appendChild(iframe);
  iframe.contentDocument.open();
  iframe.contentDocument.write(html);
  iframe.contentDocument.close();
  setTimeout(()=>{
    const offenders = [];
    iframe.contentDocument.querySelectorAll("*").forEach(el=>{
      const r = el.getBoundingClientRect();
      if(r.right > 390) {
        offenders.push({tag:el.tagName, cls:(el.className||"").substring(0,60), id:el.id||"", right:Math.round(r.right), w:Math.round(r.width)});
      }
    });
    offenders.sort((a,b)=>b.right-a.right);
    document.body.innerHTML = "<pre>"+JSON.stringify(offenders.slice(0,30),null,2)+"</pre>";
  }, 3000);
});
</script>
</body></html>
